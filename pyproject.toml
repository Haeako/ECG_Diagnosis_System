[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-cleanguard-benchmark"
version = "0.2.0"
description = "CleanGuard+ local-damage and R-peak preservation benchmark for ECG denoising"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "PyWavelets>=1.4",
  "scipy>=1.10",
  "wfdb>=4.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
af = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "shap>=0.52",
  "xgboost>=2.0",
]
sota = [
  "peakutils>=1.3.5",
  "py-ecg-detectors>=1.3.5",
  "psutil>=7.0",
  "tensorflow>=2.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
